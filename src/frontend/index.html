<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: sem ele o teclado virtual do Android sobe POR CIMA da
         caixa de resposta, porque a raiz e h-dvh com overflow escondido.
         viewport-fit=cover habilita o env(safe-area-inset-*) do iPhone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F6F3" />
    <script>
      // Aplica antes do primeiro paint, inclusive enquanto o bundle carrega.
      (() => {
        let tema = 'claro';
        try { tema = localStorage.getItem('crm-cartorio.tema') || 'claro'; } catch {}
        const escuro = tema === 'escuro' || (tema === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
        document.documentElement.style.colorScheme = escuro ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = escuro ? '#101113' : '#F7F6F3';
      })();
    </script>
    <meta
      name="description"
      content="CRM Cartório — gestão de atendimento, clientes e serviços para serventias."
    />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon-180.png" />
    <!-- WebP sem perdas, recortado na moldura: 73KB contra 173KB do PNG, e a
         mesma imagem serve o login e o cabeçalho do sistema — carregada uma vez,
         reaproveitada do cache depois de entrar. -->
    <link rel="preload" as="image" href="/brand/crm-cartorio-logo-horizontal.webp" />
    <title>CRM Cartório</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
