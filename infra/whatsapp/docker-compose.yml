# Evolution API — gateway de WhatsApp do piloto de demonstracao.
#
# NAO e a solucao final do cartorio. Roda com o numero PESSOAL do Thiago para
# demonstrar o canal sem depender dos pre-requisitos da Cloud API oficial da
# Meta (CNPJ verificado + numero dedicado), que estao travados em terceiro.
# Ver docs/INSTALACAO.md e o bloco de mudanca de direcao no docs/CONVENCOES.md.
#
# O gateway e o banco de sessao (Postgres/Redis deste compose) rodam no proprio
# servidor. Isso NAO significa que nenhum dado de conversa sai do servidor: a
# Resposta Inteligente (Modulo RespostaInteligente) envia o texto da conversa ao
# provedor de IA (Anthropic), e o tunel Cloudflare termina TLS na borda deles.
# Inventario completo, cifra e o que e mascarado antes de sair: ver
# docs/PROTECAO-DE-DADOS.md. Corrigido em 2026-09-11 — a versao anterior desta
# linha afirmava "nenhum dado sai para nuvem de terceiro", o que era falso.

name: crm-cartorio-whatsapp

services:
  evolution:
    # Versao FIXADA de proposito: `latest` num gateway que guarda sessao de
    # WhatsApp e' convite para a sessao cair sozinha depois de um pull.
    #
    # Era v2.1.1 (imagem de set/2024). Testada ao vivo em 2026-08-17: a
    # instancia entrava em loop de reconexao a cada poucos segundos, sem
    # nenhuma chamada nossa no meio — o Baileys embutido nao completa mais o
    # handshake com os servidores atuais do WhatsApp. Trocado para a mais
    # recente estavel disponivel, porque a proxima versao "so um pouco mais
    # nova" tem a mesma chance de ja estar obsoleta de novo. Organizacao do
    # Docker Hub tambem mudou de atendai/ para evoapicloud/ nesse meio tempo
    # (atendai/evolution-api passou a exigir login).
    image: evoapicloud/evolution-api:v2.3.7
    container_name: crm-cartorio-evolution
    restart: unless-stopped
    ports:
      # So no laco local. O gateway nao precisa de porta publica: quem fala com
      # ele e' a API .NET, na mesma maquina.
      - "127.0.0.1:8080:8080"
    extra_hosts:
      # `host.docker.internal` NAO existe no Docker CE — e' cortesia do Docker
      # DESKTOP. No servidor o Docker roda dentro do WSL2, e sem esta linha o
      # nome simplesmente nao resolve.
      #
      # Ressalva que vale saber: dentro do WSL2, "host" e' a VM do WSL, nao o
      # Windows. Para alcancar a API .NET (que roda no Windows, sob IIS) o
      # caminho confiavel e' a URL publica pelo tunel — ver
      # `CanalWhatsApp:UrlPublica`. Esta linha resolve o nome; ela nao promete
      # que o destino seja o Windows.
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SERVER_URL: ${SERVER_URL}

      # Autenticacao do proprio gateway. A API .NET manda esta chave no header
      # `apikey` de toda chamada REST.
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: crm_cartorio

      # O gateway guarda a instancia (a sessao pareada). O historico de conversa
      # e' do SQL Server do CRM — aqui fica so o que o Baileys precisa para nao
      # pedir QR de novo a cada restart.
      DATABASE_SAVE_DATA_INSTANCE: "true"

      # PRECISA ser "true". Testado ao vivo em 2026-08-17: com "false" a mensagem
      # que ENVIAMOS nunca fica correlacionavel do lado do gateway, e quando o
      # DELIVERY_ACK/READ volta da Meta, o Evolution loga "Original message not
      # found for update. Skipping." e o webhook messages.update NUNCA dispara —
      # o tique de entrega no fio fica preso em "Enviada" para sempre. Isto NAO
      # e o gateway virar fonte de historico (o SQL Server continua sendo):
      # e o minimo de estado que o proprio Evolution precisa para saber a qual
      # mensagem um status se refere.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: crm_cartorio
      CACHE_LOCAL_ENABLED: "false"

      # O webhook e' configurado POR INSTANCIA na hora do pareamento (ver
      # INSTALACAO.md), e nao aqui: o token compartilhado que a API .NET
      # valida vai na URL, e URL com segredo nao entra em variavel global.
      WEBHOOK_GLOBAL_ENABLED: "false"

      LOG_LEVEL: ${LOG_LEVEL:-ERROR,WARN,INFO}
      DEL_INSTANCE: "false"
    volumes:
      # A SESSAO PAREADA VIVE AQUI. Apagar este volume = parear o QR de novo.
      # Volume nomeado, nunca bind mount para dentro do repositorio: sessao de
      # WhatsApp nao pode nem chegar perto de virar arquivo versionado.
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: crm-cartorio-evolution-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      # O Evolution quebra ao subir se o banco ainda nao aceita conexao.
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crm-cartorio-evolution-cache
    restart: unless-stopped
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
